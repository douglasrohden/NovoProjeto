# Document Processing Platform — stack completa (produção)
# Subir: docker compose up -d

x-app-image: &app-image
  image: ${APP_IMAGE:-document-platform:latest}
  build: .

services:
  web:
    <<: *app-image
    env_file: .env
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      XML_SCHEMA_PATH: /app/docs/xml-schema.xsd
      TESSDATA_PATH: /app/tessdata
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TESSERACT_LANG: ${TESSERACT_LANG:-por}
      PROCESS_INLINE: ${PROCESS_INLINE:-false}
      NODE_ENV: production
    volumes:
      - uploads_data:/data/uploads
      - ./docs:/app/docs:ro
    depends_on:
      - postgres
      - redis
    entrypoint: ["./docker/entrypoint-web.sh"]
    restart: unless-stopped

  worker:
    <<: *app-image
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      XML_SCHEMA_PATH: /app/docs/xml-schema.xsd
      TESSDATA_PATH: /app/tessdata
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TESSERACT_LANG: ${TESSERACT_LANG:-por}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      NODE_ENV: production
    volumes:
      - uploads_data:/data/uploads
      - ./docs:/app/docs:ro
    depends_on:
      - postgres
      - redis
      - web
    entrypoint: ["./docker/entrypoint-worker.sh"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documents}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
